<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>选择区域</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: crosshair;
    user-select: none;
  }

  /* 热键按下那一刻的整屏画面，铺满当背景 */
  #shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
  }

  /* 四块半透明遮罩围出选区，比 box-shadow 更稳 */
  .shade {
    position: absolute;
    background: rgba(0, 0, 0, 0.42);
    pointer-events: none;
  }
  #shade-top    { left: 0; top: 0; right: 0; }
  #shade-bottom { left: 0; right: 0; bottom: 0; }
  #shade-left   { left: 0; }
  #shade-right  { right: 0; }

  #sel {
    position: absolute;
    border: 1px solid #4c9aff;
    box-shadow: 0 0 6px rgba(76, 154, 255, 0.6);
    display: none;
    pointer-events: none;
  }

  #size {
    position: absolute;
    padding: 2px 7px;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font: 12px ui-monospace, monospace;
    border-radius: 3px;
    display: none;
    pointer-events: none;
    white-space: nowrap;
  }

  #hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #e6e8ee;
    font: 15px/1.9 system-ui, "Microsoft YaHei", sans-serif;
    text-align: center;
    background: rgba(0, 0, 0, 0.78);
    padding: 20px 30px;
    border-radius: 10px;
    pointer-events: none;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  #hint kbd {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 4px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
  }
  #hint .err { color: #ff8a80; }
</style>
</head>
<body>
<img id="shot" alt="" />
<div id="shade-top" class="shade"></div>
<div id="shade-bottom" class="shade"></div>
<div id="shade-left" class="shade"></div>
<div id="shade-right" class="shade"></div>
<div id="sel"></div>
<div id="size"></div>
<div id="hint">
  拖拽鼠标框选要识别的区域<br />
  <kbd>Esc</kbd> 或 <kbd>右键</kbd> 取消
</div>

<script type="module" src="/src/overlay.js"></script>
</body>
</html>
